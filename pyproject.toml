[project]
name = "ai-scientist-v3"
version = "0.1.0"
description = "Autonomous AI research agent"
requires-python = ">=3.12"
dependencies = [
    # Viewer
    "fastapi",
    "uvicorn",
    "sse-starlette",
    "ijson",
    # Pinned to 0.7.0 — the api-external reviewer mode and the in-sandbox file
    # upload path (used by ReviewGenie's review_api.py) rely on the
    # _setup_environment hook that was renamed in harbor 0.8+. Bump deliberately.
    "harbor==0.7.0",
    # Modal (optional cloud execution)
    "modal",
    # GitLab integration
    "python-gitlab",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
